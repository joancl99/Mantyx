name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  actions: read
  contents: read

jobs:
  main:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Enable Corepack
        run: corepack enable

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm nx format:check --base=origin/main

      - name: Lint affected
        run: pnpm nx affected -t lint --base=origin/main --head=HEAD

      - name: Test affected
        run: pnpm nx affected -t test --base=origin/main --head=HEAD --configuration=ci

      - name: Build affected
        run: pnpm nx affected -t build --base=origin/main --head=HEAD --configuration=production
