name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  actions: read
  contents: read

jobs:
  main:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    # The api-e2e suite boots the real AppModule, which needs Postgres and
    # Redis. The e2e global setup creates and migrates its own database
    # (warehouse_e2e) on this server and uses Redis db 1.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: warehouse
          POSTGRES_PASSWORD: warehouse
          POSTGRES_DB: warehouse
        ports:
          - '5432:5432'
        options: >-
          --health-cmd "pg_isready -U warehouse"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - '6379:6379'
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Enable Corepack
        run: corepack enable

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The Prisma schema lives at a non-default path, so @prisma/client's
      # install hook can't auto-generate it. Generate it explicitly before any
      # tsc-based task (test/build) needs the schema-specific types and enums.
      - name: Generate Prisma Client
        run: pnpm exec prisma generate --schema=apps/api/prisma/schema.prisma

      - name: Format check
        run: pnpm nx format:check --base=origin/main

      - name: Lint
        run: |
          pnpm nx run api:eslint:lint
          pnpm nx lint web
          pnpm nx run api-e2e:eslint:lint

      - name: Test
        run: |
          pnpm nx test api
          pnpm nx test web

      - name: Build
        run: |
          pnpm nx build api
          pnpm nx build web

      - name: E2E
        run: pnpm nx e2e api-e2e
        env:
          # CI's Redis service runs without a password (the local default in
          # the e2e env support assumes the dev compose password).
          E2E_REDIS_URL: redis://localhost:6379/1
