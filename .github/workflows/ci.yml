name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  actions: read
  contents: read

jobs:
  main:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Enable Corepack
        run: corepack enable

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The Prisma schema lives at a non-default path, so @prisma/client's
      # install hook can't auto-generate it. Generate it explicitly before any
      # tsc-based task (test/build) needs the schema-specific types and enums.
      - name: Generate Prisma Client
        run: pnpm exec prisma generate --schema=apps/api/prisma/schema.prisma

      - name: Format check
        run: pnpm nx format:check --base=origin/main

      - name: Lint
        run: |
          pnpm nx run api:eslint:lint
          pnpm nx lint web
          pnpm nx run api-e2e:eslint:lint

      - name: Test
        run: |
          pnpm nx test api
          pnpm nx test web

      - name: Build
        run: |
          pnpm nx build api
          pnpm nx build web

      - name: E2E
        run: pnpm nx e2e api-e2e
