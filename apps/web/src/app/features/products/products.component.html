<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start"><ion-menu-button></ion-menu-button></ion-buttons>
    <ion-title>Productos</ion-title>
    <ion-buttons slot="end">
      <ion-button
        color="primary"
        (click)="scanner.open()"
        aria-label="Escanear código"
      >
        <ion-icon slot="icon-only" name="barcode-outline" />
      </ion-button>
    </ion-buttons>
    @if (canEdit()) {
      <ion-buttons slot="end">
        <ion-button
          color="primary"
          (click)="openCreate()"
          aria-label="Nuevo producto"
        >
          <ion-icon slot="icon-only" name="add-outline" />
        </ion-button>
      </ion-buttons>
    }
  </ion-toolbar>
</ion-header>

<ion-content [scrollY]="true" [fullscreen]="true">
  <div class="page">
    <p class="page-context">{{ list.totalLabel() }}</p>

    <app-product-filters
      [searchQuery]="list.searchQuery()"
      [selectedCategory]="list.selectedCategory()"
      [selectedBrand]="list.selectedBrand()"
      [categories]="categories()"
      [brands]="brands()"
      (searchChanged)="list.onSearch($event)"
      (categoryChanged)="list.onCategoryChange($event)"
      (brandChanged)="list.onBrandChange($event)"
    />

    <app-product-list
      [products]="list.products()"
      [loading]="list.loading()"
      [canEdit]="canEdit()"
      [canDelete]="canDelete()"
      [searchQuery]="list.searchQuery()"
      [selectedCategory]="list.selectedCategory()"
      [selectedBrand]="list.selectedBrand()"
      [currentPage]="list.currentPage()"
      [totalPages]="list.totalPages()"
      (editProduct)="openEdit($event)"
      (deleteProduct)="confirmDelete($event)"
      (pageChanged)="list.goToPage($event)"
    />
  </div>
</ion-content>

@if (showModal()) {
  <app-product-form-modal
    [mode]="modalMode()"
    [form]="form"
    [categories]="categories()"
    [brands]="brands()"
    [submitted]="submitted()"
    [saving]="saving()"
    [formError]="formError()"
    [currentImageUrl]="editingProduct()?.imageUrl ?? null"
    (closeModal)="closeModal()"
    (submitForm)="submitForm($event)"
  />
}

@if (deleteTarget()) {
  <app-product-delete-modal
    [product]="deleteTarget()!"
    [saving]="saving()"
    (cancelDelete)="cancelDelete()"
    (executeDelete)="executeDelete()"
  />
}
