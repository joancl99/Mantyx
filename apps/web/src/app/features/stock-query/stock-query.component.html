<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start"><ion-menu-button></ion-menu-button></ion-buttons>
    <ion-title>Consulta de Stock</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [scrollY]="true" [fullscreen]="true">
  <div class="stock-query-page">

    <header class="page-header">
      <div class="page-header__left">
        <h1 class="page-title">Consulta de Stock</h1>
        <span class="page-subtitle">{{ totalLabel() }}</span>
      </div>
    </header>

    <div class="search-section">
      <div class="search-wrap">
        <ion-icon name="search-outline" class="search-icon" />
        <input
          class="search-input search-input--lg"
          type="text"
          placeholder="Buscar por nombre o SKU..."
          [value]="search()"
          (input)="onSearch($any($event.target).value)"
        />
        @if (search()) {
          <button class="search-clear" (click)="clearSearch()">
            <ion-icon name="close-outline" />
          </button>
        }
      </div>
      <p class="search-hint">Selecciona un producto para ver en qué ubicaciones tiene stock</p>
    </div>

    <app-stock-query-list
      [items]="items()"
      [loading]="loading()"
      [hasSearch]="!!search()"
      [currentPage]="currentPage()"
      [totalPages]="totalPages()"
      (pageChanged)="goToPage($event)"
    />

  </div>
</ion-content>
