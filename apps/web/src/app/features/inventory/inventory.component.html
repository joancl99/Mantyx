<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-menu-button></ion-menu-button>
    </ion-buttons>
    <ion-title>Inventario</ion-title>
    <ion-buttons slot="end">
      @if (scannerService.isEnabledHere()) {
        <ion-button
          color="primary"
          (click)="scannerService.open()"
          aria-label="Escanear código"
        >
          <ion-icon slot="icon-only" name="barcode-outline" />
        </ion-button>
      }
      <ion-button
        color="primary"
        (click)="openCreate()"
        aria-label="Nuevo conteo"
      >
        <ion-icon slot="icon-only" name="add-outline" />
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content [scrollY]="true" [fullscreen]="true">
  <div class="page page--wide">
    <p class="page-context">{{ totalLabel() }}</p>

    <app-inventory-filters
      [statusOptions]="statusOptions"
      [selectedStatus]="selectedStatus()"
      [warehouses]="warehouses()"
      [selectedWarehouse]="selectedWarehouse()"
      (statusChange)="onStatusChange($event)"
      (warehouseChange)="onWarehouseFilterChange($event)"
    />

    <div class="inventory-grid">
      <app-inventory-count-list
        [counts]="counts()"
        [loading]="loading()"
        [selectedCountId]="selectedCount()?.id ?? null"
        [currentPage]="currentPage()"
        [totalPages]="totalPages()"
        (selectCount)="loadDetail($event)"
        (pageChange)="goToPage($event)"
      />

      <app-inventory-count-detail
        [count]="selectedCount()"
        [loading]="detailLoading()"
        [saving]="saving()"
        [formError]="formError()"
        [lineSubmitted]="lineSubmitted()"
        [lineForm]="lineLocation.form"
        [zones]="lineLocation.zones()"
        [aisles]="lineLocation.aisles()"
        [locations]="lineLocation.locations()"
        (startCount)="startSelected()"
        (completeCount)="completeSelected()"
        (cancelCount)="cancelSelected()"
        (zoneChange)="onZoneChange($event)"
        (aisleChange)="onAisleChange($event)"
        (scanLocation)="scanLocation()"
        (addLine)="submitLine()"
        (updateLine)="updateLine($event)"
        (removeLine)="removeLine($event)"
      />
    </div>
  </div>
</ion-content>

@if (showCreate()) {
  <app-create-inventory-count-modal
    [form]="createForm"
    [warehouses]="warehouses()"
    [submitted]="submitted()"
    [saving]="saving()"
    [formError]="formError()"
    (closeModal)="closeCreate()"
    (submitForm)="submitCreate()"
  />
}
