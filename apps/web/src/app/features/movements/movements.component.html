<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start"><ion-menu-button></ion-menu-button></ion-buttons>
    <ion-title>Movimientos</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [scrollY]="true" [fullscreen]="true">
  <div class="movements-page">

    <!-- Header -->
    <header class="page-header">
      <div class="page-header__left">
        <h1 class="page-title">Movimientos</h1>
        <span class="page-subtitle">{{ totalLabel() }}</span>
      </div>
      @if (canCreate()) {
        <button class="btn-primary" (click)="openCreate()">
          <ion-icon name="add-outline" />
          Nuevo movimiento
        </button>
      }
    </header>

    <app-movement-filters
      [filterType]="filterType()"
      [filterDateFrom]="filterDateFrom()"
      [filterDateTo]="filterDateTo()"
      [hasActiveFilters]="hasActiveFilters()"
      (typeChanged)="onTypeFilter($event)"
      (dateFromChanged)="onDateFromFilter($event)"
      (dateToChanged)="onDateToFilter($event)"
      (filtersCleared)="clearFilters()"
    />

    <app-movement-list
      [movements]="movements()"
      [loading]="loading()"
      [hasActiveFilters]="hasActiveFilters()"
      [currentPage]="currentPage()"
      [totalPages]="totalPages()"
      (pageChanged)="goToPage($event)"
    />

  </div>
</ion-content>

@if (showModal()) {
  <app-create-movement-modal
    [form]="form"
    [products]="products()"
    [warehouses]="warehouses()"
    [availableTypes]="availableTypes"
    [typeConfig]="typeConfig"
    [submitted]="submitted()"
    [saving]="saving()"
    [formError]="formError()"
    (closeModal)="closeModal()"
    (submitForm)="submitForm()"
  />
}
