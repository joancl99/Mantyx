<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start"><ion-menu-button></ion-menu-button></ion-buttons>
    <ion-title>Expediciones</ion-title>
    <ion-buttons slot="end">
      <ion-button
        color="primary"
        (click)="scanner.open()"
        aria-label="Escanear código"
      >
        <ion-icon slot="icon-only" name="barcode-outline" />
      </ion-button>
      <ion-button (click)="exportCsv()" aria-label="Exportar CSV">
        <ion-icon slot="icon-only" name="download-outline" />
      </ion-button>
      @if (canCreate()) {
        <ion-button
          color="primary"
          (click)="openModal()"
          aria-label="Nueva expedición"
        >
          <ion-icon slot="icon-only" name="add-outline" />
        </ion-button>
      }
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content [scrollY]="true" [fullscreen]="true">
  <div class="page">
    <p class="page-context">{{ list.totalLabel() }}</p>

    <app-expedition-filters
      [filterDateFrom]="list.filterDateFrom()"
      [filterDateTo]="list.filterDateTo()"
      [hasActiveFilters]="list.hasActiveFilters()"
      (dateFromChanged)="list.onDateFromFilter($event)"
      (dateToChanged)="list.onDateToFilter($event)"
      (filtersCleared)="list.clearFilters()"
    />

    <app-expedition-list
      [expeditions]="list.expeditions()"
      [loading]="list.loading()"
      [hasActiveFilters]="list.hasActiveFilters()"
      [currentPage]="list.currentPage()"
      [totalPages]="list.totalPages()"
      (pageChanged)="list.goToPage($event)"
    />
  </div>
</ion-content>

@if (showModal()) {
  <app-movement-form-modal
    [config]="modalConfig"
    [saving]="saving()"
    [formError]="formError()"
    [submitSucceeded]="submitSucceeded()"
    (closeModal)="closeModal()"
    (submitForm)="onSubmit($event)"
  />
}
