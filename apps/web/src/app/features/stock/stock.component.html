<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start"><ion-menu-button></ion-menu-button></ion-buttons>
    <ion-title>Stock</ion-title>
    <ion-buttons slot="end">
      <ion-button
        color="primary"
        (click)="scanner.open()"
        aria-label="Escanear código"
      >
        <ion-icon slot="icon-only" name="barcode-outline" />
      </ion-button>
      <ion-button (click)="exportCsv()" aria-label="Exportar CSV">
        <ion-icon slot="icon-only" name="download-outline" />
      </ion-button>
      <ion-button
        [color]="filterLowStock() ? 'primary' : undefined"
        (click)="onToggleLowStock()"
        aria-label="Filtrar por stock bajo"
      >
        <ion-icon slot="icon-only" name="warning-outline" />
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content [scrollY]="true" [fullscreen]="true">
  <div class="page">
    <p class="page-context">{{ totalLabel() }}</p>

    <!-- Search -->
    <div class="search-wrap">
      <ion-icon name="search-outline" class="search-icon" />
      <input
        class="search-input"
        type="text"
        placeholder="Buscar por nombre o SKU..."
        [value]="searchQuery()"
        (input)="onSearch($event)"
      />
    </div>

    <app-stock-list
      [items]="items()"
      [loading]="loading()"
      [filterLowStock]="filterLowStock()"
      [currentPage]="currentPage()"
      [totalPages]="totalPages()"
      (pageChange)="goToPage($event)"
    />
  </div>
</ion-content>
